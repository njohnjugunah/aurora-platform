[www]
user = appuser
group = appuser

listen = 0.0.0.0:9000
listen.backlog = 65535

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

pm.max_requests = 1000
pm.max_requests_grace_period = 30s

catch_workers_output = yes
clear_env = no

env[APP_ENV] = production
env[APP_DEBUG] = false

security.limit_extensions = .php
