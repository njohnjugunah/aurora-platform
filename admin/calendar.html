<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Calendar - GlamByMariga Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/index.global.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.10/index.global.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.10/index.global.min.css" rel="stylesheet">
    <link href="../css/glambymariga-theme.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f1e8;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--rose-gold-dark), var(--accent-gold));
            color: white;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            color: white;
            margin: 0;
        }

        .admin-sidebar {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }

        .sidebar-section h4 {
            color: var(--rose-gold-dark);
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .sidebar-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-item:hover {
            background: var(--soft-background);
            color: var(--accent-gold);
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, var(--rose-gold-dark), var(--accent-gold));
            color: white;
        }

        .calendar-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }

        .fc {
            font-family: var(--font-body);
        }

        .fc .fc-button-primary {
            background: linear-gradient(135deg, var(--rose-gold-dark), var(--accent-gold));
            border: none;
        }

        .fc .fc-button-primary:hover {
            background: var(--rose-gold-dark);
        }

        .fc .fc-button-primary.fc-button-active {
            background: var(--accent-gold);
        }

        .fc .fc-daygrid-day.fc-day-today {
            background: rgba(201, 169, 97, 0.1);
        }

        .fc .fc-event {
            border-radius: 6px;
            border: none;
        }

        .fc .fc-event.booking-confirmed {
            background: #28a745 !important;
        }

        .fc .fc-event.booking-pending {
            background: var(--accent-gold) !important;
        }

        .fc .fc-event.booking-cancelled {
            background: #dc3545 !important;
            text-decoration: line-through;
        }

        .booking-details {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-top: 2rem;
        }

        .booking-details h3 {
            color: var(--rose-gold-dark);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-gold);
        }

        .booking-item {
            background: var(--soft-background);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent-gold);
        }

        .booking-item h5 {
            color: var(--rose-gold-dark);
            margin-bottom: 0.5rem;
        }

        .booking-item p {
            margin: 0.25rem 0;
            color: var(--gray-medium);
            font-size: 0.9rem;
        }

        .booking-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .action-buttons button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: #28a745;
            color: white;
        }

        .btn-confirm:hover {
            background: #218838;
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
        }

        .btn-cancel:hover {
            background: #c82333;
        }

        .btn-reschedule {
            background: var(--accent-gold);
            color: white;
        }

        .btn-reschedule:hover {
            background: #b8941f;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--accent-gold);
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .stat-card .label {
            color: var(--gray-medium);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .admin-content {
                grid-template-columns: 1fr;
            }

            .calendar-container {
                padding: 1rem;
            }

            .fc {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container-fluid">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1><i class="fas fa-calendar-alt"></i> Appointment Calendar</h1>
                    <p style="margin: 0.5rem 0 0; opacity: 0.9;">Manage bookings and view schedule</p>
                </div>
                <a href="dashboard.html" class="btn btn-light">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container-fluid">
        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="todayBookings">0</div>
                <div class="label">Today's Bookings</div>
            </div>
            <div class="stat-card">
                <div class="number" id="weekBookings">0</div>
                <div class="label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pendingBookings">0</div>
                <div class="label">Pending Confirmation</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalRevenue">KES 0</div>
                <div class="label">Total Revenue</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 2rem; margin-bottom: 2rem;">
            <!-- Calendar -->
            <div class="calendar-container">
                <div id="calendar"></div>
            </div>

            <!-- Sidebar -->
            <div class="admin-sidebar">
                <div class="sidebar-section">
                    <h4><i class="fas fa-filter"></i> Filters</h4>
                    <div class="sidebar-item active" onclick="filterBookings('all')">
                        <span>All Bookings</span>
                    </div>
                    <div class="sidebar-item" onclick="filterBookings('pending')">
                        <span style="color: #ffc107;">●</span>
                        <span>Pending</span>
                    </div>
                    <div class="sidebar-item" onclick="filterBookings('confirmed')">
                        <span style="color: #28a745;">●</span>
                        <span>Confirmed</span>
                    </div>
                    <div class="sidebar-item" onclick="filterBookings('cancelled')">
                        <span style="color: #dc3545;">●</span>
                        <span>Cancelled</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h4><i class="fas fa-cogs"></i> Options</h4>
                    <div class="sidebar-item" onclick="exportCalendar()">
                        <i class="fas fa-download"></i>
                        <span>Export</span>
                    </div>
                    <div class="sidebar-item" onclick="openSettings()">
                        <i class="fas fa-sliders-h"></i>
                        <span>Settings</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Booking Details Panel -->
        <div class="booking-details" id="bookingPanel" style="display: none;">
            <h3>Today's Bookings</h3>
            <div id="todayBookingsList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.10/index.global.min.js"></script>

    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: function(info, successCallback, failureCallback) {
                    // Fetch events from backend
                    loadCalendarEvents().then(events => {
                        successCallback(events);
                    }).catch(error => {
                        console.error('Error loading events:', error);
                        failureCallback(error);
                    });
                },
                eventClick: function(info) {
                    showBookingDetails(info.event);
                },
                slotLabelInterval: '30:00',
                slotLabelFormat: {
                    hour: 'numeric',
                    minute: '2-digit',
                    meridiem: 'short'
                },
                businessHours: {
                    daysOfWeek: [1, 2, 3, 4, 5, 6], // Monday - Saturday
                    startTime: '08:00',
                    endTime: '20:00'
                },
                height: 'auto'
            });

            calendar.render();
            loadStatistics();
        });

        /**
         * Load calendar events from backend
         */
        async function loadCalendarEvents() {
            try {
                // In production, fetch from /ajax/bookings/get-calendar-events.php
                // For now, return empty array - will be populated by backend
                return [];
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }

        /**
         * Load statistics
         */
        function loadStatistics() {
            // In production, fetch from /ajax/admin/get-statistics.php
            // Placeholder values
            document.getElementById('todayBookings').textContent = '5';
            document.getElementById('weekBookings').textContent = '28';
            document.getElementById('pendingBookings').textContent = '3';
            document.getElementById('totalRevenue').textContent = 'KES 67,500';
        }

        /**
         * Show booking details
         */
        function showBookingDetails(event) {
            // Display booking info
            console.log('Booking:', event.extendedProps);
        }

        /**
         * Filter bookings by status
         */
        function filterBookings(status) {
            // Update sidebar active state
            document.querySelectorAll('.sidebar-item').forEach((item, index) => {
                if (index === (status === 'all' ? 0 : ['pending', 'confirmed', 'cancelled'].indexOf(status) + 1)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Reload calendar with filter
            calendar.refetchEvents();
        }

        /**
         * Export calendar
         */
        function exportCalendar() {
            alert('Calendar export feature coming soon!');
        }

        /**
         * Open settings
         */
        function openSettings() {
            // Open settings modal
            alert('Settings panel coming soon!');
        }
    </script>
</body>
</html>
